name: Lint GitHub Actions
# Triggers intentionally disabled for Argus-OSS-Security.
# on:
#   push:
#     paths: ['.github/**']
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
      - uses: alphagov/govuk-infrastructure/.github/actions/actionlint@main
